<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .float { animation: float 10s infinite linear; }
      @keyframes float {
        0% { transform: translateY(120px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateY(-50px); opacity: 0; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <g class="float" transform="translate(200, 0)">
    <g stroke="#00E5FF" stroke-width="1.5" fill="none" filter="url(#glow-cyan)">
      <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="rgba(0,229,255,0.05)"/>
      <path d="M0,-15 L0,0 M-13,7.5 L0,0 M13,7.5 L0,0"/>
      <polygon points="0,-7 6.5,-3.5 6.5,3.5 0,7 -6.5,3.5 -6.5,-3.5" fill="rgba(0,229,255,0.1)"/>
      <path d="M0,-7 L0,0 M-6.5,3.5 L0,0 M6.5,3.5 L0,0"/>
    </g>
  </g>

  <g class="float" style="animation-delay: 3s; animation-duration: 14s;" transform="translate(500, 0)">
    <g stroke="#00E5FF" stroke-width="1.5" fill="none" filter="url(#glow-cyan)">
      <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10" fill="rgba(0,229,255,0.05)"/>
      <path d="M0,-20 L0,0 M-17.3,10 L0,0 M17.3,10 L0,0"/>
      <polygon points="0,-10 8.6,-5 8.6,5 0,10 -8.6,5 -8.6,-5" fill="rgba(0,229,255,0.1)"/>
      <path d="M0,-10 L0,0 M-8.6,5 L0,0 M8.6,5 L0,0"/>
    </g>
  </g>

  <g class="float" style="animation-delay: 6s; animation-duration: 12s;" transform="translate(800, 0)">
    <g stroke="#00E5FF" stroke-width="1.5" fill="none" filter="url(#glow-cyan)">
      <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" fill="rgba(0,229,255,0.05)"/>
      <path d="M0,-15 L0,0 M-13,7.5 L0,0 M13,7.5 L0,0"/>
      <polygon points="0,-7 6.5,-3.5 6.5,3.5 0,7 -6.5,3.5 -6.5,-3.5" fill="rgba(0,229,255,0.1)"/>
      <path d="M0,-7 L0,0 M-6.5,3.5 L0,0 M6.5,3.5 L0,0"/>
    </g>
  </g>
</svg>
